<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ethan's Mission Control · Birthday Party Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ========== Reset & root ========== */
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep: #050811;
    --bg-elev: #0e1320;
    --bg-card: #161c2c;
    --bg-card-hover: #1c2438;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text-1: #eef1f8;
    --text-2: #9ba4b8;
    --text-3: #5d6478;
    --cyan: #5de4ff;
    --cyan-dim: rgba(93,228,255,0.15);
    --gold: #ffd166;
    --green: #5cffaa;
    --red: #ff7a8a;
    --rose: #ff7eb6;
    --blue: #5da8ff;
    --amber: #ffc257;
    --emerald: #5cffaa;
    --purple: #c084fc;
    --shadow: 0 10px 40px -10px rgba(0,0,0,0.6), 0 4px 12px -4px rgba(0,0,0,0.4);
    --radius: 14px;
    --radius-sm: 8px;
  }

  html, body {
    background: var(--bg-deep);
    color: var(--text-1);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(93,228,255,0.06), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(192,132,252,0.05), transparent 50%),
      var(--bg-deep);
  }

  /* Starfield */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.6; }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ========== Layout ========== */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ========== Header ========== */
  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    padding: 28px 32px;
    background: linear-gradient(135deg, rgba(93,228,255,0.08), rgba(192,132,252,0.06));
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(93,228,255,0.15), transparent 60%);
    pointer-events: none;
  }
  .brand { display: flex; gap: 20px; align-items: center; }
  .emblem {
    font-size: 44px;
    width: 72px; height: 72px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 3.5vw, 32px);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--text-2); font-size: 14px; }
  .subtitle strong { color: var(--cyan); font-weight: 600; }

  .countdown {
    text-align: center;
    padding: 12px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    min-width: 130px;
  }
  .countdown-num {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    color: var(--cyan);
    margin-bottom: 2px;
  }
  .countdown-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-2);
  }

  /* ========== Progress strip ========== */
  .progress-strip {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 16px 24px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .progress-track {
    height: 8px;
    background: rgba(255,255,255,0.04);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px rgba(93,228,255,0.5);
  }
  .progress-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
  }
  .progress-stats strong { color: var(--text-1); }

  /* Per-person mini stats */
  .person-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .person-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .person-chip:hover { border-color: var(--border-strong); background: var(--bg-card); }
  .person-chip.active { background: var(--cyan-dim); border-color: var(--cyan); }
  .person-dot { width: 8px; height: 8px; border-radius: 50%; }
  .person-name { font-weight: 600; }
  .person-count { color: var(--text-2); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  /* ========== Toolbar ========== */
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    padding: 14px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--bg-card);
    color: var(--text-1);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-card-hover); border-color: var(--cyan); }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), #4cc4e6);
    color: var(--bg-deep);
    border-color: var(--cyan);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(93,228,255,0.3); }
  .btn-icon { padding: 9px 11px; }

  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 9px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-1);
    font-family: inherit;
    font-size: 13px;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus { outline: none; border-color: var(--cyan); }

  select.filter {
    padding: 9px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-1);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  /* ========== Day groups ========== */
  .day-group { margin-bottom: 28px; }
  .day-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border-strong);
  }
  .day-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .day-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .day-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .day-badge.today { background: var(--gold); color: var(--bg-deep); }
  .day-badge.party {
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    color: var(--bg-deep);
  }
  .day-meta { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-2); }

  /* Phase sub-header (inside Sunday) */
  .phase-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 10px 4px;
  }
  .phase-line { flex: 1; height: 1px; background: var(--border); }
  .phase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-2);
    padding: 4px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--bg-elev);
  }

  /* ========== Task card ========== */
  .task {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    transition: all 0.15s;
    position: relative;
  }
  .task:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
  .task.done { opacity: 0.5; }
  .task.done .task-title { text-decoration: line-through; color: var(--text-2); }
  .task::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: var(--radius) 0 0 var(--radius);
    background: var(--assignee-color, var(--cyan));
  }

  .task-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    cursor: pointer;
    appearance: none;
    background: transparent;
    margin-top: 2px;
    flex-shrink: 0;
    transition: all 0.15s;
    position: relative;
  }
  .task-check:hover { border-color: var(--cyan); }
  .task-check:checked {
    background: var(--green);
    border-color: var(--green);
  }
  .task-check:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--bg-deep);
    font-size: 14px;
    font-weight: 800;
  }

  .task-body { min-width: 0; }
  .task-time {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    background: var(--cyan-dim);
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .task-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
    line-height: 1.35;
  }
  .task-title[contenteditable="true"] {
    outline: 2px solid var(--cyan);
    outline-offset: 4px;
    border-radius: 4px;
  }
  .task-desc {
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .task-desc[contenteditable="true"] {
    outline: 2px solid var(--cyan);
    outline-offset: 4px;
    border-radius: 4px;
    color: var(--text-1);
  }
  .task-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border-strong);
    background: rgba(255,255,255,0.02);
  }
  .badge-assignee { color: var(--assignee-color); border-color: var(--assignee-color); background: var(--assignee-bg); }
  .badge-category { color: var(--text-2); }
  .badge-phase {
    color: var(--gold);
    border-color: rgba(255,209,102,0.3);
    background: rgba(255,209,102,0.06);
  }

  .task-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .task:hover .task-actions { opacity: 1; }
  .action-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
  }
  .action-btn:hover {
    background: var(--bg-elev);
    border-color: var(--border-strong);
    color: var(--text-1);
  }
  .action-btn.danger:hover { color: var(--red); border-color: var(--red); }

  /* ========== Modal ========== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .modal p.sub { color: var(--text-2); font-size: 13px; margin-bottom: 20px; }
  .form-grid { display: grid; gap: 14px; }
  .form-row { display: grid; gap: 6px; }
  .form-row.two-col { grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .form-row.two-col { grid-template-columns: 1fr; } }
  .form-row label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-2);
    font-weight: 600;
  }
  .form-input, .form-select, .form-textarea {
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    color: var(--text-1);
    font-family: inherit;
    font-size: 14px;
  }
  .form-textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--cyan); }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 12px 24px;
    background: var(--bg-card);
    border: 1px solid var(--cyan);
    border-radius: 999px;
    color: var(--text-1);
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Sync indicator */
  .sync-indicator {
    position: fixed;
    top: 18px; right: 24px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .sync-dot.local { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .sync-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-2);
  }
  .empty-emoji { font-size: 44px; margin-bottom: 12px; }

  /* Footer */
  footer {
    margin-top: 60px;
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* Mobile tweaks */
  @media (max-width: 640px) {
    .container { padding: 20px 14px 60px; }
    .hero { padding: 20px; grid-template-columns: 1fr; }
    .countdown { justify-self: start; }
    .brand { gap: 14px; }
    .emblem { font-size: 32px; width: 56px; height: 56px; }
    .task { grid-template-columns: auto 1fr; padding: 14px; }
    .task-actions { grid-column: 1 / -1; flex-direction: row; opacity: 1; justify-content: flex-end; padding-top: 6px; border-top: 1px dashed var(--border); }
    .sync-indicator { top: auto; bottom: 12px; right: 12px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="sync-indicator" id="syncIndicator">
  <span class="sync-dot" id="syncDot"></span>
  <span id="syncLabel">…</span>
</div>

<div class="container">

  <header class="hero">
    <div class="brand">
      <div class="emblem">🚀</div>
      <div>
        <h1>Ethan's Mission Control</h1>
        <p class="subtitle">Birthday party command center · <strong>Sunday, May 17 · 2:00 PM</strong> · Catch Air → Home</p>
      </div>
    </div>
    <div class="countdown">
      <div class="countdown-num" id="cdDays">—</div>
      <div class="countdown-lbl" id="cdLabel">days to liftoff</div>
    </div>
  </header>

  <section class="progress-strip">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-stats">
      <strong id="progressDone">0</strong> / <span id="progressTotal">0</span> complete · <strong id="progressPct">0%</strong>
    </div>
  </section>

  <section class="person-stats" id="personStats"></section>

  <section class="toolbar">
    <input type="search" class="search-input" id="searchInput" placeholder="Search tasks…" />
    <select class="filter" id="filterDay">
      <option value="">All days</option>
      <option value="Thursday">Thursday</option>
      <option value="Friday">Friday</option>
      <option value="Saturday">Saturday</option>
      <option value="Sunday">Sunday</option>
      <option value="Monday">Monday</option>
    </select>
    <select class="filter" id="filterStatus">
      <option value="">All status</option>
      <option value="open">Open</option>
      <option value="done">Done</option>
    </select>
    <button class="btn" id="btnEmail" title="Email this list">📧 Email</button>
    <button class="btn" id="btnIcs" title="Download all timed tasks as .ics calendar file">📅 Calendar</button>
    <button class="btn btn-primary" id="btnAdd">+ Add Task</button>
  </section>

  <main id="timeline"></main>

  <footer>
    Built for the Sherman family · v1.0 · <span id="storageMode">localStorage</span>
  </footer>
</div>

<!-- ========== ADD / EDIT MODAL ========== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">New Task</h2>
    <p class="sub">Add details below. Time is optional but recommended for calendar export.</p>
    <div class="form-grid">
      <div class="form-row">
        <label for="fTitle">Title</label>
        <input class="form-input" id="fTitle" type="text" placeholder="e.g. Pick up balloons" />
      </div>
      <div class="form-row">
        <label for="fDesc">Description</label>
        <textarea class="form-textarea" id="fDesc" placeholder="Optional details, store names, quantities…"></textarea>
      </div>
      <div class="form-row two-col">
        <div class="form-row">
          <label for="fDay">Day</label>
          <select class="form-select" id="fDay">
            <option value="Thursday">Thursday · May 14</option>
            <option value="Friday">Friday · May 15</option>
            <option value="Saturday">Saturday · May 16</option>
            <option value="Sunday" selected>Sunday · May 17</option>
            <option value="Monday">Monday · May 18</option>
          </select>
        </div>
        <div class="form-row">
          <label for="fTime">Time</label>
          <input class="form-input" id="fTime" type="text" placeholder="e.g. 2:00 PM" />
        </div>
      </div>
      <div class="form-row two-col">
        <div class="form-row">
          <label for="fAssignee">Assignee</label>
          <select class="form-select" id="fAssignee">
            <option>Pavel</option>
            <option>Irina</option>
            <option>Babushka</option>
            <option>Toby</option>
            <option>Pavel & Irina</option>
            <option>Irina + Toby</option>
            <option>Pavel or Irina</option>
            <option>Irina + Toby + Coordinator</option>
          </select>
        </div>
        <div class="form-row">
          <label for="fPhase">Phase</label>
          <select class="form-select" id="fPhase">
            <option>Prep</option>
            <option>Daycare Party</option>
            <option>Phase 1 Setup</option>
            <option>Phase 1: Catch Air</option>
            <option>Transition</option>
            <option>Phase 2 Setup</option>
            <option>Phase 2: Home</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label for="fCategory">Category</label>
        <input class="form-input" id="fCategory" type="text" placeholder="Shopping, Food, Logistics…" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">Cancel</button>
      <button class="btn" id="btnDelete" style="display:none; border-color:var(--red); color:var(--red);">Delete</button>
      <button class="btn btn-primary" id="btnSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ETHAN'S MISSION CONTROL — Frontend logic
   - Tries /api/tasks first; falls back to localStorage
   - localStorage key: ethan_bday_tasks_v1
   ============================================================ */

const STORAGE_KEY = 'ethan_bday_tasks_v1';
const PARTY_DATE = new Date('2026-05-17T14:00:00');
const ASSIGNEE_COLORS = {
  'Pavel':       { color: '#5da8ff', bg: 'rgba(93,168,255,0.08)' },
  'Irina':       { color: '#ff7eb6', bg: 'rgba(255,126,182,0.08)' },
  'Babushka':    { color: '#ffc257', bg: 'rgba(255,194,87,0.08)' },
  'Toby':        { color: '#5cffaa', bg: 'rgba(92,255,170,0.08)' },
  '_default':    { color: '#c084fc', bg: 'rgba(192,132,252,0.08)' }
};

// Seed data (used as ultimate fallback if neither API nor localStorage have anything)
const SEED_TASKS_URL = './data/tasks.json';

let STATE = {
  tasks: [],
  filterSearch: '',
  filterDay: '',
  filterStatus: '',
  filterAssignee: '',
  editingId: null,
  mode: 'unknown', // 'api' | 'local' | 'unknown'
  serverUpdatedAt: null,
  lastLocalWrite: 0,
  pollInFlight: false,
  pendingWrites: 0
};

/* ----- Storage layer (API or localStorage) ----- */
async function loadTasks() {
  // Try API first
  try {
    const res = await fetch('/api/tasks', { method: 'GET' });
    if (res.ok) {
      const data = await res.json();
      STATE.mode = 'api';
      STATE.serverUpdatedAt = data.updatedAt || null;
      setSyncStatus('synced', 'live');
      return data.tasks || [];
    }
  } catch (e) { /* no API */ }

  STATE.mode = 'local';
  setSyncStatus('local', 'local-only');

  // Try localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch (e) {}
  }

  // Try bundled seed file
  try {
    const res = await fetch(SEED_TASKS_URL);
    if (res.ok) {
      const data = await res.json();
      return data.tasks || [];
    }
  } catch (e) {}

  // Embedded seed (ultimate fallback)
  return EMBEDDED_SEED;
}

/* ----- Per-task persistence (API mode) or bulk localStorage (local mode) ----- */
function persistLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE.tasks));
}

async function persistAdd(task) {
  STATE.lastLocalWrite = Date.now();
  STATE.pendingWrites++;
  if (STATE.mode === 'api') {
    try {
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task })
      });
      if (!res.ok) throw new Error('add failed');
      const data = await res.json();
      STATE.serverUpdatedAt = data.updatedAt;
      setSyncStatus('synced', 'live');
    } catch (e) {
      setSyncStatus('error', 'sync error');
      toast('Sync failed — try again');
    } finally {
      STATE.pendingWrites--;
    }
  } else {
    STATE.pendingWrites--;
    persistLocal();
  }
}

async function persistUpdate(id, fields) {
  STATE.lastLocalWrite = Date.now();
  STATE.pendingWrites++;
  if (STATE.mode === 'api') {
    try {
      const res = await fetch('/api/tasks/' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fields)
      });
      if (!res.ok) throw new Error('update failed');
      const data = await res.json();
      STATE.serverUpdatedAt = data.updatedAt;
      setSyncStatus('synced', 'live');
    } catch (e) {
      setSyncStatus('error', 'sync error');
      toast('Sync failed — try again');
    } finally {
      STATE.pendingWrites--;
    }
  } else {
    STATE.pendingWrites--;
    persistLocal();
  }
}

async function persistDelete(id) {
  STATE.lastLocalWrite = Date.now();
  STATE.pendingWrites++;
  if (STATE.mode === 'api') {
    try {
      const res = await fetch('/api/tasks/' + encodeURIComponent(id), { method: 'DELETE' });
      if (!res.ok) throw new Error('delete failed');
      const data = await res.json();
      STATE.serverUpdatedAt = data.updatedAt;
      setSyncStatus('synced', 'live');
    } catch (e) {
      setSyncStatus('error', 'sync error');
      toast('Sync failed — try again');
    } finally {
      STATE.pendingWrites--;
    }
  } else {
    STATE.pendingWrites--;
    persistLocal();
  }
}

/* ----- Polling: pull updates from other users ----- */
async function pollForChanges() {
  if (STATE.mode !== 'api') return;
  if (STATE.pollInFlight) return;
  if (STATE.pendingWrites > 0) return;    // wait for in-flight writes to land
  if (STATE.editingId) return;            // don't disrupt user mid-edit
  if (document.hidden) return;             // skip when tab not visible
  if (Date.now() - STATE.lastLocalWrite < 2000) return; // recent local write — give it a beat

  STATE.pollInFlight = true;
  try {
    const vRes = await fetch('/api/version');
    if (!vRes.ok) throw new Error('version check failed');
    const v = await vRes.json();
    if (v.updatedAt && v.updatedAt !== STATE.serverUpdatedAt) {
      // Someone else changed something. Refresh.
      const tRes = await fetch('/api/tasks');
      if (!tRes.ok) throw new Error('refresh failed');
      const data = await tRes.json();
      STATE.tasks = data.tasks || [];
      STATE.serverUpdatedAt = data.updatedAt;
      renderAll();
      setSyncStatus('synced', 'live');
      // subtle nudge that something changed (don't be noisy)
      if (!document.hidden) toast('Updated from another device');
    } else {
      setSyncStatus('synced', 'live');
    }
  } catch (e) {
    setSyncStatus('error', 'reconnecting…');
  } finally {
    STATE.pollInFlight = false;
  }
}

function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  const mode = document.getElementById('storageMode');
  dot.className = 'sync-dot' + (state === 'local' ? ' local' : state === 'error' ? ' error' : '');
  lbl.textContent = label;
  mode.textContent = STATE.mode === 'api' ? 'server-synced' : 'local-only';
}

/* ----- Render ----- */
function renderCountdown() {
  const now = new Date();
  const diff = PARTY_DATE - now;
  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const el = document.getElementById('cdDays');
  const lbl = document.getElementById('cdLabel');
  if (diff < 0 && diff > -86400000) {
    el.textContent = '🎉'; lbl.textContent = 'liftoff today!';
  } else if (diff <= 0) {
    el.textContent = '✨'; lbl.textContent = 'mission complete';
  } else if (days === 0) {
    el.textContent = hours;
    lbl.textContent = 'hours to liftoff';
  } else {
    el.textContent = days;
    lbl.textContent = days === 1 ? 'day to liftoff' : 'days to liftoff';
  }
}

function renderProgress() {
  const total = STATE.tasks.length;
  const done = STATE.tasks.filter(t => t.completed).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressDone').textContent = done;
  document.getElementById('progressTotal').textContent = total;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderPersonStats() {
  const byPerson = {};
  STATE.tasks.forEach(t => {
    // Pull primary assignee (first listed name)
    const primary = (t.assignee.split(/[&+]|\bor\b/)[0] || t.assignee).trim();
    byPerson[primary] = byPerson[primary] || { total: 0, done: 0 };
    byPerson[primary].total++;
    if (t.completed) byPerson[primary].done++;
  });
  // Include shared categories too
  STATE.tasks.forEach(t => {
    if (/[&+]|\bor\b/.test(t.assignee)) {
      byPerson[t.assignee] = byPerson[t.assignee] || { total: 0, done: 0 };
    }
  });

  const stats = document.getElementById('personStats');
  stats.innerHTML = '';
  const order = ['Pavel','Irina','Babushka','Toby','Pavel & Irina','Irina + Toby','Pavel or Irina','Irina + Toby + Coordinator'];
  const sorted = Object.keys(byPerson).sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  sorted.forEach(name => {
    const c = byPerson[name];
    const isActive = STATE.filterAssignee === name;
    const primary = (name.split(/[&+]|\bor\b/)[0] || name).trim();
    const col = ASSIGNEE_COLORS[primary] || ASSIGNEE_COLORS._default;
    const el = document.createElement('div');
    el.className = 'person-chip' + (isActive ? ' active' : '');
    el.innerHTML = `
      <span class="person-dot" style="background:${col.color}"></span>
      <span class="person-name">${escapeHtml(name)}</span>
      <span class="person-count">${c.done}/${c.total}</span>
    `;
    el.addEventListener('click', () => {
      STATE.filterAssignee = isActive ? '' : name;
      renderAll();
    });
    stats.appendChild(el);
  });
}

function filteredTasks() {
  const q = STATE.filterSearch.toLowerCase().trim();
  return STATE.tasks.filter(t => {
    if (STATE.filterDay && t.day !== STATE.filterDay) return false;
    if (STATE.filterStatus === 'open' && t.completed) return false;
    if (STATE.filterStatus === 'done' && !t.completed) return false;
    if (STATE.filterAssignee && t.assignee !== STATE.filterAssignee) return false;
    if (q) {
      const hay = (t.title + ' ' + t.desc + ' ' + t.assignee + ' ' + t.category + ' ' + t.phase).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

const DAY_ORDER = ['Thursday','Friday','Saturday','Sunday','Monday'];
const DAY_LABELS = {
  Thursday: { date: 'May 14', meta: '' },
  Friday:   { date: 'May 15', meta: "Mother's Day party" },
  Saturday: { date: 'May 16', meta: '' },
  Sunday:   { date: 'May 17', meta: 'PARTY DAY' },
  Monday:   { date: 'May 18', meta: 'daycare party' }
};

function renderTimeline() {
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const tasks = filteredTasks();
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';

  if (tasks.length === 0) {
    timeline.innerHTML = `<div class="empty"><div class="empty-emoji">🛸</div><div>No tasks match your filters.</div></div>`;
    return;
  }

  DAY_ORDER.forEach(day => {
    const dayTasks = tasks.filter(t => t.day === day);
    if (!dayTasks.length) return;
    const allCount = STATE.tasks.filter(t => t.day === day).length;
    const doneCount = STATE.tasks.filter(t => t.day === day && t.completed).length;
    const isToday = dayTasks[0] && dayTasks[0].date === todayStr;

    const sec = document.createElement('section');
    sec.className = 'day-group';

    const meta = DAY_LABELS[day] || { date: '', meta: '' };
    const todayBadge = isToday ? `<span class="day-badge today">Today</span>` : '';
    const partyBadge = day === 'Sunday' ? `<span class="day-badge party">⭐ Party Day</span>` : '';

    sec.innerHTML = `
      <div class="day-header">
        <span class="day-title">${day}</span>
        <span class="day-date">${meta.date}</span>
        ${todayBadge}${partyBadge}
        <span class="day-meta">${doneCount}/${allCount} done</span>
      </div>
    `;

    if (day === 'Sunday') {
      // Group Sunday by phase
      const phases = ['Phase 1 Setup', 'Phase 2 Setup', 'Phase 1: Catch Air', 'Transition', 'Phase 2: Home'];
      const phaseLabels = {
        'Phase 1 Setup': '⚙️  Phase 1 Setup',
        'Phase 2 Setup': '🏠  Phase 2 Setup',
        'Phase 1: Catch Air': '🎈  Phase 1 — Catch Air (2:00 – 4:00 PM)',
        'Transition': '🚗  Transition',
        'Phase 2: Home': '🍜  Phase 2 — Home (~4:30 – 6:00 PM)'
      };
      phases.forEach(ph => {
        const phTasks = dayTasks.filter(t => t.phase === ph).sort(sortByTime);
        if (!phTasks.length) return;
        const header = document.createElement('div');
        header.className = 'phase-header';
        header.innerHTML = `
          <span class="phase-line"></span>
          <span class="phase-label">${phaseLabels[ph] || ph}</span>
          <span class="phase-line"></span>
        `;
        sec.appendChild(header);
        phTasks.forEach(t => sec.appendChild(taskCard(t)));
      });
    } else {
      dayTasks.sort(sortByTime).forEach(t => sec.appendChild(taskCard(t)));
    }

    timeline.appendChild(sec);
  });
}

function sortByTime(a,b) {
  // Sort by time string, putting empty/non-timed first
  const wt = (s) => {
    if (!s) return -1;
    if (/morning/i.test(s)) return 100;
    if (/AM/i.test(s)) {
      const m = s.match(/(\d+):?(\d*)/); if (!m) return 200;
      const h = parseInt(m[1]); const min = parseInt(m[2]||'0');
      return 300 + h*60 + min;
    }
    if (/PM/i.test(s)) {
      const m = s.match(/(\d+):?(\d*)/); if (!m) return 1000;
      const h = parseInt(m[1]); const min = parseInt(m[2]||'0');
      return 1000 + (h%12)*60 + min;
    }
    return 50;
  };
  return wt(a.time) - wt(b.time);
}

function taskCard(t) {
  const primary = (t.assignee.split(/[&+]|\bor\b/)[0] || t.assignee).trim();
  const col = ASSIGNEE_COLORS[primary] || ASSIGNEE_COLORS._default;
  const el = document.createElement('article');
  el.className = 'task' + (t.completed ? ' done' : '');
  el.style.setProperty('--assignee-color', col.color);
  el.dataset.id = t.id;

  el.innerHTML = `
    <input type="checkbox" class="task-check" ${t.completed ? 'checked' : ''} aria-label="Mark complete" />
    <div class="task-body">
      <div class="task-title">
        ${t.time ? `<span class="task-time">${escapeHtml(t.time)}</span>` : ''}${escapeHtml(t.title)}
      </div>
      ${t.desc ? `<div class="task-desc">${escapeHtml(t.desc)}</div>` : ''}
      <div class="task-meta">
        <span class="badge badge-assignee" style="--assignee-color:${col.color};--assignee-bg:${col.bg}">${escapeHtml(t.assignee)}</span>
        ${t.category ? `<span class="badge badge-category">${escapeHtml(t.category)}</span>` : ''}
        ${t.phase ? `<span class="badge badge-phase">${escapeHtml(t.phase)}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      <button class="action-btn" data-act="edit" title="Edit">✎</button>
      <button class="action-btn" data-act="ics" title="Add to calendar (.ics)">📅</button>
      <button class="action-btn danger" data-act="delete" title="Delete">🗑</button>
    </div>
  `;

  el.querySelector('.task-check').addEventListener('change', (e) => {
    t.completed = e.target.checked;
    persistUpdate(t.id, { completed: t.completed });
    renderProgress();
    renderPersonStats();
    el.classList.toggle('done', t.completed);
    toast(t.completed ? 'Marked complete ✓' : 'Marked open');
  });

  el.querySelectorAll('.action-btn').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.dataset.act;
      if (act === 'edit') openModal(t);
      else if (act === 'delete') {
        if (confirm(`Delete "${t.title}"?`)) {
          STATE.tasks = STATE.tasks.filter(x => x.id !== t.id);
          persistDelete(t.id); renderAll(); toast('Task deleted');
        }
      }
      else if (act === 'ics') downloadIcs([t], `task-${t.id}.ics`);
    });
  });

  return el;
}

function renderAll() {
  renderCountdown();
  renderProgress();
  renderPersonStats();
  renderTimeline();
}

/* ----- Modal ----- */
function openModal(task) {
  STATE.editingId = task ? task.id : null;
  document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
  document.getElementById('btnDelete').style.display = task ? 'inline-flex' : 'none';
  document.getElementById('fTitle').value = task?.title || '';
  document.getElementById('fDesc').value = task?.desc || '';
  document.getElementById('fDay').value = task?.day || 'Sunday';
  document.getElementById('fTime').value = task?.time || '';
  document.getElementById('fAssignee').value = task?.assignee || 'Pavel';
  document.getElementById('fPhase').value = task?.phase || 'Prep';
  document.getElementById('fCategory').value = task?.category || '';
  document.getElementById('modalBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 50);
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  STATE.editingId = null;
}
function saveModal() {
  const data = {
    title: document.getElementById('fTitle').value.trim(),
    desc: document.getElementById('fDesc').value.trim(),
    day: document.getElementById('fDay').value,
    time: document.getElementById('fTime').value.trim(),
    assignee: document.getElementById('fAssignee').value,
    phase: document.getElementById('fPhase').value,
    category: document.getElementById('fCategory').value.trim(),
  };
  if (!data.title) { toast('Title required'); return; }
  const dateMap = { Thursday: '2026-05-14', Friday: '2026-05-15', Saturday: '2026-05-16', Sunday: '2026-05-17', Monday: '2026-05-18' };
  data.date = dateMap[data.day];

  if (STATE.editingId) {
    const t = STATE.tasks.find(x => x.id === STATE.editingId);
    Object.assign(t, data);
    persistUpdate(t.id, data);
    toast('Task updated ✓');
  } else {
    data.id = 'u' + Date.now();
    data.completed = false;
    STATE.tasks.push(data);
    persistAdd(data);
    toast('Task added ✓');
  }
  renderAll();
  closeModal();
}

/* ----- Email export ----- */
function emailTasks() {
  const tasks = filteredTasks();
  const grouped = {};
  tasks.forEach(t => {
    grouped[t.day] = grouped[t.day] || [];
    grouped[t.day].push(t);
  });

  let body = `ETHAN'S BIRTHDAY PARTY — TASK LIST\n`;
  body += `Sunday, May 17 · Catch Air → Home\n`;
  body += `Updated ${new Date().toLocaleString()}\n`;
  body += `=`.repeat(48) + `\n\n`;

  DAY_ORDER.forEach(day => {
    if (!grouped[day]) return;
    body += `\n--- ${day.toUpperCase()} (${DAY_LABELS[day].date}) ---\n\n`;
    grouped[day].sort(sortByTime).forEach(t => {
      const check = t.completed ? '[x]' : '[ ]';
      const time = t.time ? `${t.time} · ` : '';
      body += `${check} ${time}${t.title}\n`;
      body += `    Owner: ${t.assignee}`;
      if (t.category) body += ` · ${t.category}`;
      if (t.phase) body += ` · ${t.phase}`;
      body += `\n`;
      if (t.desc) body += `    ${t.desc}\n`;
      body += `\n`;
    });
  });

  const subject = `Ethan's Birthday Party — Task List (${tasks.length} tasks)`;
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (mailto.length > 7500) {
    // fallback: copy to clipboard
    navigator.clipboard.writeText(body).then(() => toast('Task list copied to clipboard (too long for mailto)'));
  } else {
    window.location.href = mailto;
  }
}

/* ----- ICS calendar export ----- */
function pad(n) { return String(n).padStart(2, '0'); }
function parseTaskTime(t) {
  // Returns { start, end, allDay } - duration default 30min
  const date = t.date; // 'YYYY-MM-DD'
  if (!t.time || !date) return null;

  // Handle ranges like "2:00 – 3:20 PM" or "2:00-3:20 PM"
  const rangeMatch = t.time.match(/(\d{1,2}):?(\d{0,2})\s*(AM|PM)?\s*[–-]\s*(\d{1,2}):?(\d{0,2})\s*(AM|PM)/i);
  if (rangeMatch) {
    const endAmPm = rangeMatch[6].toUpperCase();
    const startAmPm = (rangeMatch[3] || endAmPm).toUpperCase();
    const s = toDate(date, rangeMatch[1], rangeMatch[2], startAmPm);
    const e = toDate(date, rangeMatch[4], rangeMatch[5], endAmPm);
    return { start: s, end: e };
  }

  // Handle "Morning" / "Late Morning" / "AM" descriptors
  if (/morning/i.test(t.time)) {
    return { start: toDate(date, 9, 0, 'AM'), end: toDate(date, 10, 0, 'AM') };
  }
  if (/^AM$/i.test(t.time)) {
    return { start: toDate(date, 8, 0, 'AM'), end: toDate(date, 9, 0, 'AM') };
  }

  // Handle approximate "~2:00 PM"
  const cleaned = t.time.replace('~', '').trim();
  const m = cleaned.match(/(\d{1,2}):?(\d{0,2})\s*(AM|PM)/i);
  if (m) {
    const s = toDate(date, m[1], m[2], m[3].toUpperCase());
    const e = new Date(s.getTime() + 30*60000);
    return { start: s, end: e };
  }
  return null;
}
function toDate(dateStr, h, min, ap) {
  const [Y,M,D] = dateStr.split('-').map(Number);
  let hh = parseInt(h);
  const mm = parseInt(min || '0');
  if (ap === 'PM' && hh < 12) hh += 12;
  if (ap === 'AM' && hh === 12) hh = 0;
  return new Date(Y, M-1, D, hh, mm, 0);
}
function fmtIcsDate(d) {
  return d.getFullYear()
    + pad(d.getMonth()+1)
    + pad(d.getDate())
    + 'T' + pad(d.getHours())
    + pad(d.getMinutes()) + '00';
}
function downloadIcs(tasks, filename) {
  let ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Sherman Family//Ethan Birthday//EN\r\nCALSCALE:GREGORIAN\r\n`;
  let count = 0;
  tasks.forEach(t => {
    const parsed = parseTaskTime(t);
    if (!parsed) {
      // Untimed: create all-day event
      if (!t.date) return;
      const [Y,M,D] = t.date.split('-');
      const next = new Date(Number(Y), Number(M)-1, Number(D)+1);
      ics += `BEGIN:VEVENT\r\n`;
      ics += `UID:${t.id}@ethan-bday-${t.date}\r\n`;
      ics += `DTSTART;VALUE=DATE:${Y}${M}${D}\r\n`;
      ics += `DTEND;VALUE=DATE:${next.getFullYear()}${pad(next.getMonth()+1)}${pad(next.getDate())}\r\n`;
      ics += `SUMMARY:${icsEscape('🎂 ' + t.title)}\r\n`;
      ics += `DESCRIPTION:${icsEscape((t.assignee ? 'Owner: ' + t.assignee + '\\n' : '') + (t.desc || ''))}\r\n`;
      ics += `END:VEVENT\r\n`;
      count++;
    } else {
      ics += `BEGIN:VEVENT\r\n`;
      ics += `UID:${t.id}@ethan-bday-${t.date}\r\n`;
      ics += `DTSTART:${fmtIcsDate(parsed.start)}\r\n`;
      ics += `DTEND:${fmtIcsDate(parsed.end)}\r\n`;
      ics += `SUMMARY:${icsEscape('🎂 ' + t.title)}\r\n`;
      ics += `DESCRIPTION:${icsEscape((t.assignee ? 'Owner: ' + t.assignee + '\\n' : '') + (t.desc || ''))}\r\n`;
      if (/Catch Air/i.test(t.title) || /Catch Air/i.test(t.desc || '')) {
        ics += `LOCATION:${icsEscape('Catch Air')}\r\n`;
      }
      ics += `END:VEVENT\r\n`;
      count++;
    }
  });
  ics += `END:VCALENDAR\r\n`;

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  toast(`Calendar file with ${count} event${count===1?'':'s'} downloaded`);
}
function icsEscape(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
}

/* ----- Misc ----- */
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ----- Starfield ----- */
function makeStars() {
  const layer = document.getElementById('stars');
  const N = 90;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDuration = (Math.random() * 4 + 2) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    layer.appendChild(s);
  }
}

/* ----- Event wiring ----- */
function wireEvents() {
  document.getElementById('btnAdd').addEventListener('click', () => openModal(null));
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', saveModal);
  document.getElementById('btnDelete').addEventListener('click', () => {
    if (!STATE.editingId) return;
    if (confirm('Delete this task?')) {
      const idToDelete = STATE.editingId;
      STATE.tasks = STATE.tasks.filter(x => x.id !== idToDelete);
      persistDelete(idToDelete); renderAll(); closeModal(); toast('Task deleted');
    }
  });
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
  document.getElementById('btnEmail').addEventListener('click', emailTasks);
  document.getElementById('btnIcs').addEventListener('click', () => downloadIcs(filteredTasks(), 'ethan-bday-tasks.ics'));
  document.getElementById('searchInput').addEventListener('input', (e) => {
    STATE.filterSearch = e.target.value;
    renderTimeline();
  });
  document.getElementById('filterDay').addEventListener('change', (e) => {
    STATE.filterDay = e.target.value;
    renderTimeline();
  });
  document.getElementById('filterStatus').addEventListener('change', (e) => {
    STATE.filterStatus = e.target.value;
    renderTimeline();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

/* ----- Boot ----- */
(async function init() {
  makeStars();
  wireEvents();
  STATE.tasks = await loadTasks();
  renderAll();
  setInterval(renderCountdown, 60000);

  // Multi-user sync: poll every 4s when in API mode
  if (STATE.mode === 'api') {
    setInterval(pollForChanges, 4000);
    // Also poll immediately when the tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) pollForChanges();
    });
  }
})();
