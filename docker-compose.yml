###############################################################################
# Wyze RTSP Bridge — Docker Compose
#
# Copy .env.example to .env, fill in your credentials, then run:
#
#   docker compose up -d
#
# Home Assistant integration:
#   rtsp://<YOUR_IP>:8554/<camera_name>
#   (with RTSP_USER / RTSP_PASSWORD if set)
###############################################################################

services:
  wyze-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wyze-rtsp-bridge
    restart: unless-stopped

    # ── Credentials (via .env file — never hardcode here) ────────────────
    env_file:
      - .env

    # ── Port mapping ─────────────────────────────────────────────────────
    ports:
      # RTSP  — used by Home Assistant, VLC, any RTSP client
      - "${RTSP_PORT:-8554}:8554/tcp"
      # HLS   — browser-accessible streams (optional, comment out to disable)
      - "${HLS_PORT:-8888}:8888/tcp"
      # NOTE: The mediamtx management API (9997) is intentionally NOT exposed
      #       outside the container; it binds to 127.0.0.1 inside.

    # ── Unraid / host networking notes ───────────────────────────────────
    # For Unraid, you may prefer network_mode: bridge (the default above).
    # If your cameras require mDNS/multicast discovery, uncomment this line
    # and remove the ports section above:
    # network_mode: host

    # ── Resource limits (adjust for your hardware) ───────────────────────
    deploy:
      resources:
        limits:
          # Each camera stream uses roughly 50–150 MB RAM and 5–15% CPU
          # depending on resolution and bitrate settings.
          memory: 1g
        reservations:
          memory: 128m

    # ── Health check ─────────────────────────────────────────────────────
    healthcheck:
      test: ["/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # ── Logging ──────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ── Security hardening ───────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    read_only: false    # mediamtx needs a small /tmp; set true if you add tmpfs
    # tmpfs:
    #   - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL             # Drop all Linux capabilities
    cap_add: []         # Add none back (ffmpeg/mediamtx don't need special caps)
