<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px;
      background: #f5f5f5;
    }

    h1 { margin: 0; }

    .timers {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .timer {
      background: white;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      min-width: 180px;
    }

    .timer h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: #555;
    }

    .timer .display {
      font-size: 2.5rem;
      font-variant-numeric: tabular-nums;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .timer .display .seconds {
      color: #e44;
    }

    .timer .display .separator {
      color: #aaa;
    }

    .timer .controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-start  { background: #4caf50; color: white; }
    .btn-pause  { background: #ff9800; color: white; }
    .btn-reset  { background: #9e9e9e; color: white; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h1>Countdown Timers</h1>
  <div class="timers" id="timers"></div>

  <script>
    const TIMER_CONFIGS = [
      { label: "5-Minute Timer",  seconds: 300 },
      { label: "10-Minute Timer", seconds: 600 },
      { label: "30-Second Timer", seconds: 30  },
    ];

    function formatDisplay(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;

      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");

      if (h > 0) {
        const hh = String(h).padStart(2, "0");
        return `${hh}<span class="separator">:</span>${mm}<span class="separator">:</span><span class="seconds">${ss}</span>`;
      }
      return `${mm}<span class="separator">:</span><span class="seconds">${ss}</span>`;
    }

    function createTimer(config) {
      let remaining = config.seconds;
      let intervalId = null;
      let running = false;

      const el = document.createElement("div");
      el.className = "timer";
      el.innerHTML = `
        <h2>${config.label}</h2>
        <div class="display"></div>
        <div class="controls">
          <button class="btn-start">Start</button>
          <button class="btn-pause">Pause</button>
          <button class="btn-reset">Reset</button>
        </div>
      `;

      const display = el.querySelector(".display");
      const btnStart = el.querySelector(".btn-start");
      const btnPause = el.querySelector(".btn-pause");
      const btnReset = el.querySelector(".btn-reset");

      function render() {
        display.innerHTML = formatDisplay(remaining);
      }

      function tick() {
        if (remaining <= 0) {
          clearInterval(intervalId);
          running = false;
          display.innerHTML = `<span class="seconds">00</span>`;
          return;
        }
        remaining--;
        render();
      }

      btnStart.addEventListener("click", () => {
        if (running || remaining <= 0) return;
        running = true;
        intervalId = setInterval(tick, 1000);
      });

      btnPause.addEventListener("click", () => {
        clearInterval(intervalId);
        running = false;
      });

      btnReset.addEventListener("click", () => {
        clearInterval(intervalId);
        running = false;
        remaining = config.seconds;
        render();
      });

      render();
      return el;
    }

    const container = document.getElementById("timers");
    TIMER_CONFIGS.forEach(cfg => container.appendChild(createTimer(cfg)));
  </script>
</body>
</html>
